name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev, lab16]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        working-directory: boardy-laravel
        run: find app routes database -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Python syntax check
        working-directory: boardy-api
        run: python -m compileall . -q
  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build 
      - name: Start stack
        run: |
          cp .env.example .env
          cp boardy-laravel/.env.example boardy-laravel/.env
          
          docker compose up -d 
          docker compose exec -T laravel composer install --no-interaction --prefer-dist --optimize-autoloader
          docker compose exec -T laravel php artisan key:generate
          docker compose exec laravel php artisan migrate
          docker compose exec laravel php artisan passport:client --public --name="Boardy SPA" --redirect_uri="http://localhost/oauth/callback"
          
          docker compose restart fastapi
          for i in {1..30}; do
            if curl -fs http://localhost/health && curl -fs http://localhost/api/health; then
              echo "Success! Laravel and FastAPI are both UP!"
              break
            fi
            echo "Services are not ready yet, waiting... (Attempt $i/30)"
            sleep 2
          done
      - name: Check FastAPI logs
        if: always() # Выполнится в любом случае!
        run: |
          echo "=== FASTAPI LOGS ==="
          docker compose logs fastapi
          echo "=== NGINX LOGS ==="
          docker compose logs nginx
      - name: Smoke endpoints
        run: | 
          curl -f http://localhost/health
          curl -f http://localhost/api/health
      - name: Tear down
        if: always()
        run: docker compose down -v