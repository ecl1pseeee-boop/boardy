name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev, lab16]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        working-directory: boardy-laravel
        run: find app routes database -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Python syntax check
        working-directory: boardy-api
        run: python -m compileall . -q
  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build 
      - name: Start stack
        run: |
          cp boardy-laravel/.env.example boardy-laravel/.env
          
          docker compose up -d 
          for i in {1..30}; do 
            curl -fs http://localhost/health && break 
            sleep 2 
          done
      - name: Smoke endpoints
        run: | 
          curl -f http://localhost/health
          curl -f http://localhost/api/health
      - name: Tear down
        if: always()
        run: docker compose down -v